name: Deploy Plugin

on:
  workflow_call:
    inputs:
      plugin-slug:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # --- Setup ---
      - name: Checkout plugin code
        uses: actions/checkout@v4

      - name: Checkout build tool
        uses: actions/checkout@v4
        with:
          repository: polevaultweb/premmerce-plugin-build
          path: build-tool
          token: ${{ secrets.GH_PAT }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer, php-cs-fixer
          extensions: curl, json, zip

      - name: Install build tool dependencies
        run: cd build-tool && composer install --no-dev --no-interaction

      # --- Read config ---
      - name: Read release config
        id: config
        run: |
          echo "freemius_id=$(jq -r '.freemius_id // empty' release.json)" >> $GITHUB_OUTPUT
          echo "freemius_upload=$(jq -r '.channels.freemius' release.json)" >> $GITHUB_OUTPUT
          echo "plugin_type=$(jq -r '.type' release.json)" >> $GITHUB_OUTPUT
          echo "wordpress_org=$(jq -r '.channels.wordpress_org' release.json)" >> $GITHUB_OUTPUT
          echo "woocommerce=$(jq -r '.channels.woocommerce' release.json)" >> $GITHUB_OUTPUT
          echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          echo "Plugin: ${{ inputs.plugin-slug }}"
          echo "Version: ${GITHUB_REF_NAME}"
          echo "Type: $(jq -r '.type' release.json)"
          echo "Freemius upload: $(jq -r '.channels.freemius' release.json)"
          echo "WP.org: $(jq -r '.channels.wordpress_org' release.json)"
          echo "WooCommerce: $(jq -r '.channels.woocommerce' release.json)"

      # --- Build ---
      - name: Build plugin
        run: |
          mkdir -p build-tool/plugins/${{ inputs.plugin-slug }}
          rsync -a --exclude=build-tool $GITHUB_WORKSPACE/ build-tool/plugins/${{ inputs.plugin-slug }}/
          cd build-tool
          php console plugin:build plugins/${{ inputs.plugin-slug }}

      # --- Freemius Upload (Revenues plan only) ---
      - name: Upload to Freemius
        id: freemius-upload
        if: steps.config.outputs.freemius_upload == 'true'
        run: |
          cd build-tool
          RESPONSE=$(php console plugin:freemius-tag \
            "output/freemius/${{ inputs.plugin-slug }}.zip" \
            "--dev_id=${{ secrets.FREEMIUS_DEV_ID }}" \
            "--public_key=${{ secrets.FREEMIUS_PUBLIC_KEY }}" \
            "--secret_key=${{ secrets.FREEMIUS_SECRET_KEY }}" \
            "--plugin_id=${{ steps.config.outputs.freemius_id }}")
          echo "Freemius response: $RESPONSE"
          # Extract JSON line and parse tag ID (Freemius returns id as string "108712")
          JSON_LINE=$(echo "$RESPONSE" | grep '^{' | tail -1)
          TAG_ID=$(echo "$JSON_LINE" | jq -r '.id')
          if [ -z "$TAG_ID" ] || [ "$TAG_ID" = "null" ]; then
            echo "::error::Failed to parse tag ID from Freemius response"
            echo "$RESPONSE"
            exit 1
          fi
          echo "tag_id=$TAG_ID" >> $GITHUB_OUTPUT
          echo "Freemius tag ID: $TAG_ID"

      # --- Download free version from Freemius (Revenues plan + WP.org only) ---
      # Revenues plan plugins need Freemius-generated free version for WP.org
      # Hobby/Free plan plugins skip this and use built output directly for SVN
      - name: Download free version from Freemius
        id: freemius-download
        if: steps.freemius-upload.outputs.tag_id != '' && steps.config.outputs.wordpress_org == 'true'
        run: |
          cd build-tool
          TAG_ID=${{ steps.freemius-upload.outputs.tag_id }}
          PLUGIN_ID=${{ steps.config.outputs.freemius_id }}
          mkdir -p output/wp
          MAX_ATTEMPTS=20
          ATTEMPT=0
          echo "Waiting for Freemius to process free version (tag $TAG_ID, plugin $PLUGIN_ID)..."
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS..."
            if php console plugin:freemius-download \
              "$TAG_ID" "output/wp" \
              "--plugin_id=$PLUGIN_ID" \
              "--dev_id=${{ secrets.FREEMIUS_DEV_ID }}" \
              "--public_key=${{ secrets.FREEMIUS_PUBLIC_KEY }}" \
              "--secret_key=${{ secrets.FREEMIUS_SECRET_KEY }}" 2>&1; then
              echo "Download command succeeded"
              break
            else
              echo "Download command failed (exit $?)"
            fi
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "Not ready yet, waiting 15s..."
              sleep 15
            fi
          done
          if [ ! -f "output/wp/${PLUGIN_ID}-free.zip" ]; then
            echo "::error::Failed to download free version after $MAX_ATTEMPTS attempts"
            ls -la output/wp/ || true
            exit 1
          fi
          echo "Downloaded: $(ls -la output/wp/${PLUGIN_ID}-free.zip)"
          unzip -oq "output/wp/${PLUGIN_ID}-free.zip" -d output/wp
          echo "free_version_ready=true" >> $GITHUB_OUTPUT
          echo "Free version downloaded and extracted"

      # --- WordPress.org SVN ---
      - name: Publish to WordPress.org
        if: steps.config.outputs.wordpress_org == 'true'
        run: |
          sudo apt-get install -y subversion
          VERSION=${{ steps.config.outputs.version }}
          SLUG=${{ inputs.plugin-slug }}

          # Determine source: Freemius free version, or first available build output
          if [ "${{ steps.freemius-download.outputs.free_version_ready }}" == "true" ]; then
            BUILD_DIR=$(ls -d build-tool/output/wp/*/ | head -1)
          else
            # Find first build output directory (could be output/wp/, output/freemius/, etc.)
            BUILD_DIR=$(find build-tool/output -maxdepth 2 -mindepth 2 -type d ! -path '*/woocommerce_market/*' | head -1)
          fi

          if [ -z "$BUILD_DIR" ]; then
            echo "::error::No build output directory found"
            ls -R build-tool/output/ || true
            exit 1
          fi

          echo "Publishing $SLUG v$VERSION to WordPress.org from $BUILD_DIR"

          # Checkout SVN repo (trunk + latest tag only for speed)
          svn co "https://plugins.svn.wordpress.org/$SLUG" svn-repo \
            --depth immediates \
            --username "${{ secrets.WORDPRESS_ORG_SVN_USERNAME }}" \
            --password "${{ secrets.WORDPRESS_ORG_SVN_PASSWORD }}" \
            --no-auth-cache

          # Fetch trunk and tags listing
          cd svn-repo
          svn update trunk --set-depth infinity
          svn update tags --set-depth immediates
          cd ..

          # Use build tool to prepare SVN (copies to trunk, creates tag)
          cd build-tool
          php console plugin:publish ../$BUILD_DIR ../svn-repo --ver=$VERSION
          cd ..

          # Commit to WordPress.org
          cd svn-repo
          svn commit -m "Release $VERSION" \
            --username "${{ secrets.WORDPRESS_ORG_SVN_USERNAME }}" \
            --password "${{ secrets.WORDPRESS_ORG_SVN_PASSWORD }}" \
            --no-auth-cache

      # --- WooCommerce build (artifact only, manual upload to woo.com) ---
      - name: Build WooCommerce version
        if: steps.config.outputs.woocommerce == 'true'
        run: |
          cd build-tool
          php console plugin:build plugins/${{ inputs.plugin-slug }} --woocommerce

      - name: Upload WooCommerce artifact
        if: steps.config.outputs.woocommerce == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: woocommerce-build
          path: build-tool/output/woocommerce_market/*.zip

      # --- GitHub Release ---
      - name: Find and rename build zip
        id: find-zip
        run: |
          SLUG=${{ inputs.plugin-slug }}
          VERSION=${{ steps.config.outputs.version }}
          # Prefer the freemius build zip, fall back to any non-free-download zip
          if [ -f "build-tool/output/freemius/${SLUG}.zip" ]; then
            ZIP="build-tool/output/freemius/${SLUG}.zip"
          else
            ZIP=$(find build-tool/output -maxdepth 2 -name '*.zip' ! -name '*-free.zip' ! -path '*/woocommerce_market/*' | head -1)
          fi
          if [ -z "$ZIP" ]; then
            echo "::error::No build zip found"
            find build-tool/output -name '*.zip' || true
            exit 1
          fi
          # Rename to {slug}-{version}.zip for the GitHub Release
          DEST="build-tool/output/${SLUG}-${VERSION}.zip"
          cp "$ZIP" "$DEST"
          echo "zip_path=$DEST" >> $GITHUB_OUTPUT
          echo "Found zip: $ZIP -> $DEST"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find-zip.outputs.zip_path }}
          generate_release_notes: true

      # --- Mark Freemius tag as released (LAST STEP, Revenues plan only) ---
      - name: Mark Freemius tag as released
        if: steps.freemius-upload.outputs.tag_id != ''
        run: |
          cd build-tool
          RESPONSE=$(php console plugin:freemius-release \
            "${{ steps.freemius-upload.outputs.tag_id }}" \
            "--dev_id=${{ secrets.FREEMIUS_DEV_ID }}" \
            "--public_key=${{ secrets.FREEMIUS_PUBLIC_KEY }}" \
            "--secret_key=${{ secrets.FREEMIUS_SECRET_KEY }}" \
            "--plugin_id=${{ steps.config.outputs.freemius_id }}")
          echo "Freemius release response: $RESPONSE"
          echo "Tag ${{ steps.freemius-upload.outputs.tag_id }} marked as released"
